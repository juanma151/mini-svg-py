name: Build and Deploy Docs (versioned)

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history for mike)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material mkdocstrings mkdocstrings-python mike

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy docs with mike
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          # Determine version:
          # - tag refs: refs/tags/v0.1.0 -> 0.1.0
          # - main branch: deploy only "latest"
          if [[ "$REF" == refs/tags/v* ]]; then
            VERSION="${REF#refs/tags/v}"
            echo "Deploying versioned docs: $VERSION"
            cd docs-site
            mike deploy --push --update-aliases "$VERSION" latest
            mike set-default --push latest
          else
            echo "Deploying docs to alias: latest (from main)"
            cd docs-site
            mike deploy --push --update-aliases latest
            mike set-default --push latest
          fi
