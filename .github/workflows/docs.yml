name: Build and Deploy Docs (versioned)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history required for mike)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material mkdocstrings mkdocstrings-python mike ruff

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch gh-pages branch (if exists)
        run: |
          git fetch origin gh-pages:gh-pages || true

      - name: Deploy docs with mike
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          cd docs-site

          if [[ "$REF" == refs/tags/v* ]]; then
            VERSION="${REF#refs/tags/v}"
            echo "Deploying versioned docs: $VERSION"

            mike deploy -b gh-pages --push --rebase --update-aliases "$VERSION" latest
            mike set-default -b gh-pages --push latest
          else
            echo "Deploying docs to alias: latest (from main)"

            mike deploy -b gh-pages --push --rebase --update-aliases latest
            mike set-default -b gh-pages --push latest
          fi

