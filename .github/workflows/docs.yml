name: Build and Deploy Docs (versioned)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history required)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material mkdocstrings mkdocstrings-python mike ruff

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare gh-pages branch (fetch + rebase)
        run: |
          set -euo pipefail

          git fetch origin gh-pages:gh-pages || true

          if git show-ref --verify --quiet refs/heads/gh-pages; then
            git checkout gh-pages
            git pull --rebase origin gh-pages
            git checkout -
          fi

      - name: Deploy docs with mike
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          cd docs-site

          if [[ "$REF" == refs/tags/v* ]]; then
            VERSION="${REF#refs/tags/v}"
            echo "Deploying versioned docs: $VERSION"

            # Publish the numbered version and update the "stable" alias.
            mike deploy -b gh-pages --push --update-aliases "$VERSION" stable
            mike set-default -b gh-pages --push stable
          else
            echo "Deploying docs to alias: dev (from main)"

            # Publish main branch docs under the "dev" alias (no numbered version).
            mike deploy -b gh-pages --push --update-aliases dev
            mike set-default -b gh-pages --push dev
          fi

